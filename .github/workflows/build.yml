name: Build Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -o RackRight-android-project.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build test APK
        working-directory: project
        run: gradle --no-daemon assembleDebug
      - name: Load upload key
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGNING_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key yet - skipping Play Store bundle"
          fi
      - name: Build Play Store bundle
        if: env.SIGNING_FILE != ''
        working-directory: project
        env:
          SIGNING_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon bundleRelease
      - name: Collect
        run: |
          mkdir out
          cp project/app/build/outputs/apk/debug/*.apk out/RackRight-test.apk
          if [ -d project/app/build/outputs/bundle/release ]; then
            cp project/app/build/outputs/bundle/release/*.aab out/RackRight-PLAYSTORE.aab
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RackRight build ${{ github.run_number }}
          prerelease: true
          files: out/*
